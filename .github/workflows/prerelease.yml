name: Prerelease
# `push` is limited to main so PR commits do not publish twice (once per event).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.ref_type }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Prerelease
    # pkg-pr-new resolves the run through its public API, which cannot see a private repository. This
    # turns itself on when the repository goes public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Prerelease
        run: |
          pnpm build
          pnpm dlx pkg-pr-new publish --pnpm
